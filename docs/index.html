<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuInsight (Retired)</title>
    <meta
      name="description"
      content="DocuInsight was a contract review platform built around DocuSign. Read about what we built, why we shut it down, and what we learned."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://docuinsight.ai/" />
    <meta property="og:title" content="DocuInsight (Retired)" />
    <meta
      property="og:description"
      content="DocuInsight was a contract review platform built around DocuSign. Read about what we built, why we shut it down, and what we learned."
    />
    <meta
      property="og:image"
      content="https://docuinsight.ai/assets/images/social-preview.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DocuInsight (Retired)" />
    <meta
      name="twitter:description"
      content="DocuInsight was a contract review platform built around DocuSign. Read about what we built, why we shut it down, and what we learned."
    />
    <meta
      name="twitter:image"
      content="https://docuinsight.ai/assets/images/social-preview.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/icons/favicon-16x16.png"
    />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="shortcut icon" href="assets/icons/favicon.ico" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body>
    <div class="view-switch" role="group" aria-label="Choose page view">
      <button
        type="button"
        data-view="book"
        aria-label="Book view"
        title="Book view"
        aria-pressed="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="13" rx="2" />
          <path d="M8 21h8M12 17v4" />
        </svg>
      </button>
      <button
        type="button"
        data-view="scrolling"
        aria-label="Scrolling view"
        title="Scrolling view"
        aria-pressed="false"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="7" y="3" width="10" height="18" rx="2" />
          <path d="M11 18h2" />
        </svg>
      </button>
    </div>
    <iframe
      id="layout"
      title="DocuInsight project archive"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        fullscreen;
      "
      allowfullscreen
    ></iframe>
    <noscript>
      <style>
        .view-switch {
          display: none;
        }
      </style>
      <iframe
        src="views/scrolling.html"
        title="DocuInsight project archive"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          fullscreen;
        "
        allowfullscreen
      ></iframe>
    </noscript>
    <script src="assets/js/site.js" defer></script>
  </body>
</html>
