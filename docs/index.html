<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuInsight (Retired)</title>
    <meta
      name="description"
      content="DocuInsight was a contract review platform built around DocuSign. Read about what we built, why we shut it down, and what we learned."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://docuinsight.ai/" />
    <meta property="og:title" content="DocuInsight (Retired)" />
    <meta
      property="og:description"
      content="DocuInsight was a contract review platform built around DocuSign. Read about what we built, why we shut it down, and what we learned."
    />
    <meta property="og:image" content="https://docuinsight.ai/thumbnail.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DocuInsight (Retired)" />
    <meta
      name="twitter:description"
      content="DocuInsight was a contract review platform built around DocuSign. Read about what we built, why we shut it down, and what we learned."
    />
    <meta name="twitter:image" content="https://docuinsight.ai/thumbnail.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="shortcut icon" href="favicon.ico" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        border: 0;
      }

      .view-switch {
        position: fixed;
        z-index: 100;
        top: max(0.75rem, env(safe-area-inset-top));
        right: max(0.75rem, env(safe-area-inset-right));
        display: flex;
        gap: 0.125rem;
        padding: 0.25rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 3px 16px rgba(20, 20, 19, 0.12);
      }

      .view-switch button {
        display: grid;
        place-items: center;
        width: 2.25rem;
        height: 2.25rem;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #54534f;
        cursor: pointer;
      }

      .view-switch button:hover,
      .view-switch button[aria-pressed="true"] {
        background: #dfecf9;
        color: #1c4d7d;
      }

      .view-switch button:focus-visible {
        outline: 2px solid #245b8d;
        outline-offset: 2px;
      }

      .view-switch svg {
        width: 1.125rem;
        height: 1.125rem;
      }

      @media (pointer: coarse) {
        .view-switch button {
          width: 2.75rem;
          height: 2.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="view-switch" role="group" aria-label="Choose page view">
      <button
        type="button"
        data-view="new"
        aria-label="Book view"
        title="Book view"
        aria-pressed="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="13" rx="2" />
          <path d="M8 21h8M12 17v4" />
        </svg>
      </button>
      <button
        type="button"
        data-view="old"
        aria-label="Scrolling view"
        title="Scrolling view"
        aria-pressed="false"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="7" y="3" width="10" height="18" rx="2" />
          <path d="M11 18h2" />
        </svg>
      </button>
    </div>
    <iframe
      id="layout"
      title="DocuInsight project archive"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        fullscreen;
      "
      allowfullscreen
    ></iframe>
    <noscript>
      <style>
        .view-switch {
          display: none;
        }
      </style>
      <iframe
        src="old.html"
        title="DocuInsight project archive"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          fullscreen;
        "
        allowfullscreen
      ></iframe>
    </noscript>
    <script>
      (() => {
        const frame = document.getElementById("layout");
        const buttons = document.querySelectorAll(".view-switch button");
        const storageKey = "docuinsight-view";
        let layout = null;

        function savedView() {
          try {
            return window.localStorage.getItem(storageKey) === "old"
              ? "old"
              : "new";
          } catch (_) {
            return "new";
          }
        }

        function saveView(view) {
          try {
            window.localStorage.setItem(storageKey, view);
          } catch (_) {
            // The switch still works when browser storage is unavailable.
          }
        }

        // The scrolling and book layouts share most section IDs. Map the
        // book-only pages to the corresponding section in the scrolling view.
        function anchorFor(hash, nextLayout) {
          if (nextLayout !== "old" || !hash) return hash;
          const id = hash.slice(1).split("--")[0];
          const equivalents = {
            capabilities: "about",
            issues: "failure",
            colophon: "lessons",
          };
          return `#${equivalents[id] || id}`;
        }

        function currentAnchor() {
          try {
            const view = frame.contentWindow;
            if (
              view.document.readyState !== "complete" ||
              !view.location.pathname.endsWith(`/${layout}.html`)
            ) {
              return view.location.hash || window.location.hash;
            }
            if (layout === "old") {
              // The scrolling layout may have moved without changing its hash.
              let id = "top";
              const threshold = view.innerHeight * 0.3;
              view.document
                .querySelectorAll("section[id]")
                .forEach((section) => {
                  if (section.getBoundingClientRect().top <= threshold)
                    id = section.id;
                });
              return `#${id}`;
            }
            return view.location.hash || "#top";
          } catch (_) {
            return window.location.hash;
          }
        }

        function switchLayout(next) {
          if (next === layout) return;

          const hash = anchorFor(
            layout ? currentAnchor() : window.location.hash,
            next,
          );
          const url = new URL(`${next}.html`, window.location.href);
          url.search = window.location.search;
          url.hash = hash;

          const previous = layout;
          layout = next;
          buttons.forEach((button) => {
            button.setAttribute(
              "aria-pressed",
              String(button.dataset.view === next),
            );
          });
          if (previous) {
            try {
              frame.contentWindow.location.replace(url.href);
            } catch (_) {
              frame.src = url.href;
            }
          } else {
            frame.src = url.href;
          }
        }

        // Keep shared links pointing at the index, including the current book
        // page. Both files are same-origin; the switch also works without it.
        frame.addEventListener("load", () => {
          try {
            const view = frame.contentWindow;
            const syncHash = () => {
              const hash = view.location.hash;
              if (window.location.hash !== hash) {
                history.replaceState(
                  null,
                  "",
                  window.location.pathname + window.location.search + hash,
                );
              }
            };
            view.addEventListener("hashchange", syncHash);
            const replaceState = view.history.replaceState.bind(view.history);
            view.history.replaceState = (...args) => {
              replaceState(...args);
              syncHash();
            };
            syncHash();
          } catch (_) {
            // A browser may isolate local files; the switch still works.
          }
        });

        window.addEventListener("hashchange", () => {
          try {
            frame.contentWindow.location.hash = anchorFor(
              window.location.hash,
              layout,
            );
          } catch (_) {}
        });

        buttons.forEach((button) => {
          button.addEventListener("click", () => {
            const next = button.dataset.view;
            saveView(next);
            switchLayout(next);
          });
        });
        switchLayout(savedView());
      })();
    </script>
  </body>
</html>
